<!DOCTYPE html>
<html>
<head>
    <title>📄 Upload Resume</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 40px;
            background: linear-gradient(to right, #74ebd5, #acb6e5);
            margin: 0;
            animation: fadeInBody 1s ease-in-out;
        }

        @keyframes fadeInBody {
            0% { opacity: 0; transform: scale(0.97); }
            100% { opacity: 1; transform: scale(1); }
        }

        .box {
            background: rgba(255, 255, 255, 0.95);
            width: 400px;
            margin: auto;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.2);
            animation: slideIn 1s ease;
        }

        @keyframes slideIn {
            from { transform: translateY(30px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        h2 {
            text-align: center;
            color: #333;
            margin-bottom: 20px;
        }

        h3 {
            color: #555;
            margin-bottom: 10px;
        }

        input[type="file"] {
            width: 100%;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #ccc;
            background-color: #f9f9f9;
            transition: border-color 0.3s ease, box-shadow 0.3s ease;
        }

        input[type="file"]:focus {
            border-color: #007bff;
            box-shadow: 0 0 6px rgba(0, 123, 255, 0.4);
            outline: none;
        }

        button[type="submit"] {
            background: linear-gradient(to right, #007bff, #00c6ff);
            color: white;
            padding: 12px;
            width: 100%;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            box-shadow: 0 6px 16px rgba(0, 123, 255, 0.3);
            transition: transform 0.3s ease, background 0.3s ease;
        }

        button[type="submit"]:hover {
            transform: scale(1.03);
            background: linear-gradient(to right, #0056b3, #009fd9);
        }

        a {
            display: block;
            text-align: center;
            margin-top: 15px;
            color: #007bff;
            font-weight: bold;
            text-decoration: none;
            transition: color 0.3s ease;
        }

        a:hover {
            color: #004f9e;
        }
    </style>
</head>
<body>
    <div class="box">
        <h2>📄 Upload Your Resume</h2>
        <form method="POST" enctype="multipart/form-data">
            {% csrf_token %}
            <h3>📄 Upload Your Resume</h3>
            <input type="file" name="resume" accept=".pdf,.docx" required><br><br>
            <button type="submit">📤 Upload & Start Interview</button>
        </form>
        <br>
        <a href="{% url 'user_dashboard' %}">⬅ Back to Dashboard</a>
    </div>
</body>
</html>
