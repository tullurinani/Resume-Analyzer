{% extends 'base.html' %}
{% block title %}Interview score | Resume Analyzer AI{% endblock %}
{% block content %}
<div class="page-heading"><div class="eyebrow">STAFF REVIEW</div><h1>Interview score</h1><p>Enter transparent rubric scores between 0 and 100.</p></div>
<section class="card narrow">
  <form method="post">
    {% csrf_token %}
    <div class="field"><label for="comm_score">Communication</label><input class="form-control" type="number" min="0" max="100" name="comm_score" id="comm_score" required value="{{ interview.communication_score }}"></div>
    <div class="field"><label for="rel_score">Answer relevance</label><input class="form-control" type="number" min="0" max="100" name="rel_score" id="rel_score" required value="{{ interview.relevance_score }}"></div>
    <div class="field"><label for="conf_score">Confidence / delivery</label><input class="form-control" type="number" min="0" max="100" name="conf_score" id="conf_score" required value="{{ interview.confidence_score }}"></div>
    <button class="button" type="submit">Save rubric score</button>
  </form>
  <p class="muted">Current average: <strong>{{ interview.total_score }}</strong></p>
</section>
{% endblock %}
